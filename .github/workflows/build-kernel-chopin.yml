name: Build Kernel Module

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Checkout Module Source
      uses: actions/checkout@v4

    - name: Install necessary packages & Clang 13
      run: |
        apt-get update
        export DEBIAN_FRONTEND=noninteractive
        ln -fs /usr/share/zoneinfo/America/New_York /etc/localtime
        apt-get install -y tzdata
        dpkg-reconfigure --frontend noninteractive tzdata
        apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev \
        g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools \
        pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl \
        policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 \
        lib32ncurses5-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler \
        python3 python2 wget xz-utils
        apt-get install -y binutils-aarch64-linux-gnu
        apt-get install -y gnupg2 lsb-release
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | apt-key add -
        echo "deb http://apt.llvm.org/focal/ llvm-toolchain-focal-13 main" >> /etc/apt/sources.list
        apt-get update
        apt-get install -y clang-13 lld-13

    - name: Set up Environment
      run: |
        update-alternatives --install /usr/bin/clang clang /usr/bin/clang-13 100
        update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-13 100
        update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/lld-13 100
        echo "CCACHE_DIR=$(pwd)/.ccache" >> $GITHUB_ENV
        echo "USE_CCACHE=1" >> $GITHUB_ENV
        ccache -M 5G

    - name: Cache Dependencies
      uses: actions/cache@v4
      id: cache
      with:
        path: |
          kernel_source
          ~/.ccache
        key: ${{ runner.os }}-kernel-mt6989-final-${{ hashFiles('**/Makefile', 'kernel/**') }}
        restore-keys: |
          ${{ runner.os }}-kernel-mt6989-final-

    - name: Download Kernel Source (tar.gz)
      run: |
        if [ -d kernel_source/.git ]; then
          echo "kernel_source already prepared"
        else
          rm -rf kernel_source
          wget -q https://github.com/oppo-source/android_kernel_oppo_mt6989/archive/refs/heads/oppo_mt6989_u_14.0.1_oppo_find_x7.tar.gz -O kernel.tar.gz
          tar xf kernel.tar.gz
          mv android_kernel_oppo_mt6989-* kernel_source
          rm kernel.tar.gz
        fi

    - name: Fix all missing Kconfig files
      working-directory: ./kernel_source
      run: |
        echo "Scanning for source'd Kconfig files..."
        # 找出所有被 source 引用的路径，并创建空文件
        find . -name 'Kconfig*' -type f -exec grep -H 'source ' {} \; | \
          sed -n 's/.*source "\([^"]*\)".*/\1/p' | sort -u | while read f; do
            if [ ! -f "$f" ]; then
              echo "Creating empty file: $f"
              mkdir -p "$(dirname "$f")"
              touch "$f"
            fi
          done
        echo "All Kconfig files prepared."

    - name: Prepare Kernel Source for Module Build
      working-directory: ./kernel_source
      run: |
        # 清理可能存在的坏 out 目录
        rm -rf out
        rm -rf drivers/hack
        mkdir -p drivers/hack
        cp -a ../kernel/. drivers/hack/
        grep -q 'source "drivers/hack/Kconfig"' drivers/Kconfig || echo 'source "drivers/hack/Kconfig"' >> drivers/Kconfig
        grep -q 'obj-$(CONFIG_KERNEL_HACK) += hack/' drivers/Makefile || echo 'obj-$(CONFIG_KERNEL_HACK) += hack/' >> drivers/Makefile

        # 配置内核（现在不会再有 Kconfig 缺失）
        make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- LD=ld.lld gki_defconfig
        scripts/config --file out/.config --enable CONFIG_KERNEL_HACK

    - name: Build Kernel Module
      working-directory: ./kernel_source
      run: |
        make -j$(nproc --all) O=out ARCH=arm64 CC="ccache clang" CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- LD=ld.lld modules_prepare
        make -j$(nproc --all) O=out ARCH=arm64 CC="ccache clang" CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- LD=ld.lld M=drivers/hack

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KernelModule
        path: kernel_source/out/drivers/hack/my_driver.ko
